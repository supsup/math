<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 445" width="1020" height="445" role="img" aria-label="Finite five-site Coulomb model with two antipodal optimal branches through a common center" font-family="Georgia,serif"><rect width="1020" height="445" fill="#f7f4ed"/><text x="38" y="48" font-size="27" fill="#26333d">Five sites, two optimal Coulomb branches</text><text x="38" y="76" font-size="15" fill="#596a72">The central third splits across two antipodal pairs; each outer atom holds only one sixth.</text><rect x="35" y="100" width="555" height="300" rx="12" fill="#fffdf9" stroke="#d7d4ca"/><rect x="608" y="100" width="376" height="300" rx="12" fill="#fffdf9" stroke="#d7d4ca"/><line x1="130" y1="250" x2="500" y2="250" stroke="#527fa9" stroke-width="7" opacity=".55"/><line x1="315" y1="120" x2="315" y2="380" stroke="#bd7956" stroke-width="7" opacity=".55"/><circle cx="130" cy="250" r="27" fill="#527fa9"/><text x="130" y="256" text-anchor="middle" font-size="18" fill="#fffdf9">−e₁</text><text x="167" y="226" font-size="15" fill="#596a72">1/6</text><circle cx="500" cy="250" r="27" fill="#527fa9"/><text x="500" y="256" text-anchor="middle" font-size="18" fill="#fffdf9">+e₁</text><text x="537" y="226" font-size="15" fill="#596a72">1/6</text><circle cx="315" cy="125" r="27" fill="#bd7956"/><text x="315" y="131" text-anchor="middle" font-size="18" fill="#fffdf9">+e₂</text><text x="352" y="101" font-size="15" fill="#596a72">1/6</text><circle cx="315" cy="375" r="27" fill="#bd7956"/><text x="315" y="381" text-anchor="middle" font-size="18" fill="#fffdf9">−e₂</text><text x="352" y="351" font-size="15" fill="#596a72">1/6</text><circle cx="315" cy="250" r="27" fill="#26333d"/><text x="315" y="256" text-anchor="middle" font-size="18" fill="#fffdf9">0</text><text x="352" y="226" font-size="15" fill="#596a72">1/3</text><text x="630" y="145" font-size="20" fill="#26333d">Exact dual certificate</text><text x="630" y="185" font-size="18" fill="#527fa9">u(0) = 5/2</text><text x="630" y="215" font-size="18" fill="#bd7956">u(outer) = 0</text><text x="630" y="263" font-size="17" fill="#26333d">optimal cost = 5/2</text><text x="630" y="307" font-size="15" fill="#596a72">2 opposite pairs touch the bound</text><text x="630" y="333" font-size="15" fill="#596a72">4 cross pairs cost 2 + 1/√2</text><text x="630" y="370" font-size="14" fill="#596a72">Atomic Monge cost is infinite.</text><text x="38" y="426" font-size="13" fill="#596a72">Finite mechanism only · the source smooth theorem has equal finite infima without attainment · Marlow</text></svg>
