<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" aria-label="Two extremal cycle clique Ramsey colourings" font-family="Georgia, serif"><rect width="1000" height="530" fill="#f7f4ed"/><text x="500" y="44" text-anchor="middle" font-size="25" fill="#242320">Two ways to delay a Ramsey collision</text><text x="500" y="72" text-anchor="middle" font-size="15" fill="#242320">No red 4-cycle · No blue triangle · Six vertices</text><line x1="110" y1="155" x2="320" y2="155" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="110" y1="155" x2="400" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="110" y1="155" x2="400" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="115" x2="320" y2="155" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="115" x2="400" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="115" x2="400" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="205" x2="320" y2="155" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="205" x2="400" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="190" y1="205" x2="400" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="110" y1="155" x2="190" y2="115" stroke="#ad4d35" stroke-width="4"/><line x1="110" y1="155" x2="190" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="190" y1="115" x2="190" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="320" y1="155" x2="400" y2="115" stroke="#ad4d35" stroke-width="4"/><line x1="320" y1="155" x2="400" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="400" y1="115" x2="400" y2="205" stroke="#ad4d35" stroke-width="4"/><circle cx="110" cy="155" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="110" y="160" text-anchor="middle" font-size="13" fill="#242320">1</text><circle cx="190" cy="115" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="190" y="120" text-anchor="middle" font-size="13" fill="#242320">2</text><circle cx="190" cy="205" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="190" y="210" text-anchor="middle" font-size="13" fill="#242320">3</text><circle cx="320" cy="155" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="320" y="160" text-anchor="middle" font-size="13" fill="#242320">4</text><circle cx="400" cy="115" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="400" y="120" text-anchor="middle" font-size="13" fill="#242320">5</text><circle cx="400" cy="205" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="400" y="210" text-anchor="middle" font-size="13" fill="#242320">6</text><text x="255" y="258" text-anchor="middle" font-size="20" fill="#242320">no red bridge</text><text x="255" y="281" text-anchor="middle" font-size="15" fill="#242320">10 labelled colourings</text><line x1="600" y1="155" x2="810" y2="155" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="600" y1="155" x2="890" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="600" y1="155" x2="890" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="680" y1="115" x2="810" y2="155" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="680" y1="115" x2="890" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="680" y1="115" x2="890" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="680" y1="205" x2="890" y2="115" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="680" y1="205" x2="890" y2="205" stroke="#718aa0" stroke-width="1.5" opacity="0.43"/><line x1="600" y1="155" x2="680" y2="115" stroke="#ad4d35" stroke-width="4"/><line x1="600" y1="155" x2="680" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="680" y1="115" x2="680" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="810" y1="155" x2="890" y2="115" stroke="#ad4d35" stroke-width="4"/><line x1="810" y1="155" x2="890" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="890" y1="115" x2="890" y2="205" stroke="#ad4d35" stroke-width="4"/><line x1="680" y1="205" x2="810" y2="155" stroke="#ad4d35" stroke-width="4"/><circle cx="600" cy="155" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="600" y="160" text-anchor="middle" font-size="13" fill="#242320">1</text><circle cx="680" cy="115" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="680" y="120" text-anchor="middle" font-size="13" fill="#242320">2</text><circle cx="680" cy="205" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="680" y="210" text-anchor="middle" font-size="13" fill="#242320">3</text><circle cx="810" cy="155" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="810" y="160" text-anchor="middle" font-size="13" fill="#242320">4</text><circle cx="890" cy="115" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="890" y="120" text-anchor="middle" font-size="13" fill="#242320">5</text><circle cx="890" cy="205" r="12" fill="#f7f4ed" stroke="#242320" stroke-width="1.7"/><text x="890" y="210" text-anchor="middle" font-size="13" fill="#242320">6</text><text x="745" y="258" text-anchor="middle" font-size="20" fill="#242320">one red bridge</text><text x="745" y="281" text-anchor="middle" font-size="15" fill="#242320">90 labelled colourings</text><line x1="55" y1="314" x2="945" y2="314" stroke="#718aa0" stroke-width="1" opacity="0.5"/><text x="65" y="347" font-size="16" fill="#242320">A red triangle must exist. Every outside vertex has at most one red neighbour in it,</text><text x="65" y="375" font-size="16" fill="#242320">or a red 4-cycle appears. Two outside vertices cannot be joined by a blue edge:</text><text x="65" y="403" font-size="16" fill="#242320">a triangle vertex misses both in red and would close a blue triangle.</text><text x="65" y="431" font-size="16" fill="#242320">So the other three vertices form a red triangle. Two red bridges would close a red 4-cycle.</text><text x="65" y="459" font-size="16" fill="#242320">A seventh vertex makes the outside four a red K4, which already contains a 4-cycle.</text><text x="500" y="509" text-anchor="middle" font-size="13" fill="#718aa0">Critical types: Radziszowski &amp; Jin (1994), Thm 3</text></svg>
