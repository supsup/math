<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="1180" height="340" role="img" aria-label="Two scoped finite-field template obstructions at 25 hubs" font-family="Georgia,serif"><rect width="1180" height="340" fill="#f7f4ed"/><text x="34" y="48" font-size="27" fill="#25313a">Two limits of the F₂₅ affine template</text><rect x="32" y="78" width="535" height="200" rx="12" fill="#fffdf8" stroke="#d7d4ca"/><rect x="588" y="78" width="560" height="200" rx="12" fill="#fffdf8" stroke="#d7d4ca"/><text x="52" y="114" font-size="19" fill="#3b927e">Translation-invariant seed</text><text x="52" y="149" font-size="16" fill="#25313a">C₅ × C₅ acts on 12 Hamilton cycles</text><text x="52" y="180" font-size="16" fill="#25313a">12 ≢ 0 mod 5 ⇒ a cycle is fixed</text><text x="52" y="211" font-size="16" fill="#25313a">but C₅ × C₅ cannot embed in D₅₀</text><text x="52" y="248" font-size="15" fill="#5c6970">No fully translation-invariant Hamilton seed</text><text x="608" y="114" font-size="19" fill="#b47751">All primitive-power pages rainbow</text><text x="608" y="149" font-size="16" fill="#25313a">25 pages demand 25 even incidences per color</text><text x="608" y="180" font-size="16" fill="#25313a">each edge belongs to 0 or 2 even pages</text><text x="608" y="211" font-size="16" fill="#25313a">odd demand ≠ even supply</text><text x="608" y="248" font-size="15" fill="#5c6970">This does not rule out 11 selected pages</text><text x="34" y="316" font-size="13" fill="#5c6970">Template limits only; finite K₂₅,t certificates establish the exact partition formula · Marlow</text></svg>
