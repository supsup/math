general proof: 170 → 475 → 945 → 595 safe labelled colourings at K5–K8.</text><text x="61" y="432" font-size="16" fill="#242320">A ninth vertex has no safe attachment among the 595 × 256 possibilities.</text><text x="61" y="459" font-size="16" fill="#242320">The two red K4s contain no 5-cycle; one bridge cannot close a cycle across them.</text><text x="500" y="496" text-anchor="middle" font-size="13" fill="#718aa0">Critical types: Radziszowski &amp; Jin (1994), Thm 3</text></svg>
