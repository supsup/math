<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 445" width="940" height="445" role="img" aria-label="Prime seven growth gadget: a six-hub cycle with alternating edges for two new leaves and distinct displaced midpoint leaves" font-family="Georgia,serif"><rect width="940" height="445" fill="#f7f4ed"/><text x="32" y="47" font-size="26" fill="#24313a">Two new leaves from a multiplicative hub cycle</text><text x="32" y="76" font-size="15" fill="#5c6970">p = 7, primitive root 3; the short cycle visits hubs 1, 3, 2, 6, 4, 5</text><line x1="270.0" y1="110.0" x2="378.3" y2="172.5" stroke="#348b7b" stroke-width="8"/><text x="338.6" y="120.1" text-anchor="middle" font-size="13" fill="#24313a">d2 · ℓ2</text><line x1="378.3" y1="172.5" x2="378.3" y2="297.5" stroke="#b7754c" stroke-width="8"/><text x="407.3" y="239.0" text-anchor="middle" font-size="13" fill="#24313a">d1 · ℓ6</text><line x1="378.3" y1="297.5" x2="270.0" y2="360.0" stroke="#348b7b" stroke-width="8"/><text x="338.6" y="357.9" text-anchor="middle" font-size="13" fill="#24313a">d3 · ℓ4</text><line x1="270.0" y1="360.0" x2="161.7" y2="297.5" stroke="#b7754c" stroke-width="8"/><text x="201.4" y="357.9" text-anchor="middle" font-size="13" fill="#24313a">d2 · ℓ5</text><line x1="161.7" y1="297.5" x2="161.7" y2="172.5" stroke="#348b7b" stroke-width="8"/><text x="132.7" y="239.0" text-anchor="middle" font-size="13" fill="#24313a">d1 · ℓ1</text><line x1="161.7" y1="172.5" x2="270.0" y2="110.0" stroke="#b7754c" stroke-width="8"/><text x="201.4" y="120.1" text-anchor="middle" font-size="13" fill="#24313a">d3 · ℓ3</text><circle cx="270.0" cy="110.0" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="270.0" y="116.0" text-anchor="middle" font-size="19" fill="#24313a">1</text><circle cx="378.3" cy="172.5" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="378.3" y="178.5" text-anchor="middle" font-size="19" fill="#24313a">3</text><circle cx="378.3" cy="297.5" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="378.3" y="303.5" text-anchor="middle" font-size="19" fill="#24313a">2</text><circle cx="270.0" cy="360.0" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="270.0" y="366.0" text-anchor="middle" font-size="19" fill="#24313a">6</text><circle cx="161.7" cy="297.5" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="161.7" y="303.5" text-anchor="middle" font-size="19" fill="#24313a">4</text><circle cx="161.7" cy="172.5" r="20" fill="#fffdf8" stroke="#24313a" stroke-width="2"/><text x="161.7" y="178.5" text-anchor="middle" font-size="19" fill="#24313a">5</text><text x="525" y="159" font-size="19" fill="#24313a">Each edge carries:</text><text x="525" y="192" font-size="17" fill="#348b7b">teal → new leaf x</text><text x="525" y="225" font-size="17" fill="#b7754c">copper → new leaf y</text><text x="525" y="265" font-size="16" fill="#24313a">d = original full-cycle difference</text><text x="525" y="294" font-size="16" fill="#24313a">ℓ = displaced old leaf midpoint</text><text x="525" y="334" font-size="16" fill="#5c6970">Each color uses d1, d2, d3 once.</text><text x="32" y="416" font-size="13" fill="#5c6970">The six distinct midpoints form the new short cycle; hub 0 is omitted · Marlow</text></svg>
