<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="Eight affine difference classes, their even and odd selected edges and midpoints at seventeen hubs" font-family="Georgia,serif"><rect width="1120" height="520" fill="#f7f4ed"/><text x="32" y="45" font-size="27" fill="#25313a">A different growth page at seventeen hubs</text><text x="32" y="75" font-size="15" fill="#5c6970">Each column samples all eight affine difference colors; sixteen midpoints are distinct.</text><text x="45" y="120" font-size="18" fill="#25313a">difference</text><text x="220" y="120" font-size="18" fill="#3b927e">even edge · midpoint</text><text x="600" y="120" font-size="18" fill="#b47751">odd edge · midpoint</text><text x="87" y="155" text-anchor="middle" font-size="16" fill="#25313a">d1</text><text x="220" y="155" font-size="16" fill="#3b927e">1–2 · ℓ10</text><text x="600" y="155" font-size="16" fill="#b47751">6–7 · ℓ15</text><rect x="32" y="169" width="1040" height="34" rx="5" fill="#ebe8df"/><text x="87" y="193" text-anchor="middle" font-size="16" fill="#25313a">d2</text><text x="220" y="193" font-size="16" fill="#3b927e">5–3 · ℓ4</text><text x="600" y="193" font-size="16" fill="#b47751">3–1 · ℓ2</text><text x="87" y="231" text-anchor="middle" font-size="16" fill="#25313a">d3</text><text x="220" y="231" font-size="16" fill="#3b927e">15–12 · ℓ5</text><text x="600" y="231" font-size="16" fill="#b47751">16–13 · ℓ6</text><rect x="32" y="245" width="1040" height="34" rx="5" fill="#ebe8df"/><text x="87" y="269" text-anchor="middle" font-size="16" fill="#25313a">d4</text><text x="220" y="269" font-size="16" fill="#3b927e">7–11 · ℓ9</text><text x="600" y="269" font-size="16" fill="#b47751">11–15 · ℓ13</text><text x="87" y="307" text-anchor="middle" font-size="16" fill="#25313a">d5</text><text x="220" y="307" font-size="16" fill="#3b927e">9–14 · ℓ3</text><text x="600" y="307" font-size="16" fill="#b47751">10–5 · ℓ16</text><rect x="32" y="321" width="1040" height="34" rx="5" fill="#ebe8df"/><text x="87" y="345" text-anchor="middle" font-size="16" fill="#25313a">d6</text><text x="220" y="345" font-size="16" fill="#3b927e">4–10 · ℓ7</text><text x="600" y="345" font-size="16" fill="#b47751">14–8 · ℓ11</text><text x="87" y="383" text-anchor="middle" font-size="16" fill="#25313a">d7</text><text x="220" y="383" font-size="16" fill="#3b927e">13–6 · ℓ1</text><text x="600" y="383" font-size="16" fill="#b47751">2–9 · ℓ14</text><rect x="32" y="397" width="1040" height="34" rx="5" fill="#ebe8df"/><text x="87" y="421" text-anchor="middle" font-size="16" fill="#25313a">d8</text><text x="220" y="421" font-size="16" fill="#3b927e">8–16 · ℓ12</text><text x="600" y="421" font-size="16" fill="#b47751">12–4 · ℓ8</text><text x="32" y="492" font-size="14" fill="#5c6970">Compatible translated centers: 0, 1, 2, 3, 8, 9, 10, 11 · seven suffice for every odd base · Marlow</text></svg>
