<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730" role="img" aria-label="Minimum forbidden copies in one-vertex extensions of critical cycle triangle colorings" font-family="Georgia, serif"><rect width="960" height="730" fill="#f7f4ed"/><text x="480" y="43" text-anchor="middle" font-size="25" fill="#242320">The first unavoidable collisions</text><text x="480" y="70" text-anchor="middle" font-size="15" fill="#242320">One vertex joins a critical colouring · red Cₘ copies + blue K₃ copies</text><text x="86" y="164" text-anchor="end" font-size="19" fill="#242320">m = 4</text><rect x="120" y="135" width="36.67" height="25" rx="3" fill="#468875"/><text x="172.67000000000002" y="154" font-size="17" fill="#242320">3</text><rect x="120" y="167" width="24.44" height="25" rx="3" fill="#b58a45"/><text x="160.44" y="186" font-size="17" fill="#242320">2</text><text x="86" y="268" text-anchor="end" font-size="19" fill="#242320">m = 5</text><rect x="120" y="239" width="97.78" height="25" rx="3" fill="#468875"/><text x="233.78" y="258" font-size="17" fill="#242320">8</text><rect x="120" y="271" width="110.0" height="25" rx="3" fill="#b58a45"/><text x="246.0" y="290" font-size="17" fill="#242320">9</text><text x="86" y="372" text-anchor="end" font-size="19" fill="#242320">m = 6</text><rect x="120" y="343" width="195.56" height="25" rx="3" fill="#468875"/><text x="331.56" y="362" font-size="17" fill="#242320">16</text><rect x="120" y="375" width="195.56" height="25" rx="3" fill="#b58a45"/><text x="331.56" y="394" font-size="17" fill="#242320">16</text><text x="86" y="476" text-anchor="end" font-size="19" fill="#242320">m = 7</text><rect x="120" y="447" width="305.56" height="25" rx="3" fill="#468875"/><text x="441.56" y="466" font-size="17" fill="#242320">25</text><rect x="120" y="479" width="305.56" height="25" rx="3" fill="#b58a45"/><text x="441.56" y="498" font-size="17" fill="#242320">25</text><text x="86" y="580" text-anchor="end" font-size="19" fill="#242320">m = 8</text><rect x="120" y="551" width="440.0" height="25" rx="3" fill="#468875"/><text x="576.0" y="570" font-size="17" fill="#242320">36</text><rect x="120" y="583" width="440.0" height="25" rx="3" fill="#b58a45"/><text x="576.0" y="602" font-size="17" fill="#242320">36</text><rect x="680" y="120" width="245" height="412" rx="8" fill="#eee8da"/><text x="700" y="161" font-size="18" fill="#242320">For m ≥ 6</text><text x="700" y="211" font-size="34" fill="#242320">(m−2)²</text><text x="700" y="238" font-size="15" fill="#242320">sharp for both bases</text><text x="700" y="310" font-size="17" fill="#242320">Optimal attachments</text><text x="700" y="344" font-size="15" fill="#242320">no bridge: (m−1)²</text><text x="700" y="373" font-size="15" fill="#242320">one bridge: 1</text><text x="700" y="467" font-size="14" fill="#242320">Conditional one-vertex</text><text x="700" y="491" font-size="14" fill="#242320">extension count</text><rect x="120" y="646" width="15" height="15" fill="#468875"/><text x="143" y="659" font-size="14" fill="#242320">two cliques, no bridge</text><rect x="420" y="646" width="15" height="15" fill="#b58a45"/><text x="443" y="659" font-size="14" fill="#242320">two cliques, one red bridge</text><text x="480" y="691" text-anchor="middle" font-size="13" fill="#242320">m = 4–6 enumerated; m = 7–8 follow the proved formula</text><text x="480" y="716" text-anchor="middle" font-size="12" fill="#468875">Critical types: Radziszowski &amp; Jin (1994), Thm 3</text></svg>
