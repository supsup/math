<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Minimum forbidden copies in one-vertex extensions of critical cycle triangle colorings" font-family="Georgia, serif"><rect width="960" height="540" fill="#f7f4ed"/><text x="480" y="43" text-anchor="middle" font-size="25" fill="#242320">The first unavoidable collisions</text><text x="480" y="70" text-anchor="middle" font-size="15" fill="#242320">One vertex joins a critical colouring · red Cₘ copies + blue K₃ copies</text><text x="83" y="165" text-anchor="end" font-size="19" fill="#242320">m = 4</text><rect x="120" y="135" width="95.62" height="26" rx="3" fill="#718aa0"/><text x="232.62" y="154" font-size="17" fill="#242320">3</text><rect x="120" y="168" width="63.75" height="26" rx="3" fill="#ad4d35"/><text x="200.75" y="187" font-size="17" fill="#242320">2</text><text x="83" y="277" text-anchor="end" font-size="19" fill="#242320">m = 5</text><rect x="120" y="247" width="255.0" height="26" rx="3" fill="#718aa0"/><text x="392.0" y="266" font-size="17" fill="#242320">8</text><rect x="120" y="280" width="286.88" height="26" rx="3" fill="#ad4d35"/><text x="423.88" y="299" font-size="17" fill="#242320">9</text><text x="83" y="389" text-anchor="end" font-size="19" fill="#242320">m = 6</text><rect x="120" y="359" width="510.0" height="26" rx="3" fill="#718aa0"/><text x="647.0" y="378" font-size="17" fill="#242320">16</text><rect x="120" y="392" width="510.0" height="26" rx="3" fill="#ad4d35"/><text x="647.0" y="411" font-size="17" fill="#242320">16</text><rect x="120" y="475" width="15" height="15" fill="#718aa0"/><text x="143" y="488" font-size="14" fill="#242320">two cliques, no bridge</text><rect x="420" y="475" width="15" height="15" fill="#ad4d35"/><text x="443" y="488" font-size="14" fill="#242320">two cliques, one red bridge</text><text x="480" y="524" text-anchor="middle" font-size="12" fill="#718aa0">Critical types: Radziszowski &amp; Jin</text></svg>
