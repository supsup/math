<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Exact terminal probabilities for triangle removal from K6 and K7" font-family="Georgia,serif"><rect width="980" height="540" fill="#f7f4ed"/><text x="42" y="55" font-size="28" fill="#242320">Where the last edges land</text><text x="42" y="85" font-size="16" fill="#625e57">Exact terminal laws for uniform triangle removal on two complete graphs</text><text x="43" y="155" font-size="23" fill="#242320">K6</text><text x="105" y="155" font-size="15" fill="#625e57">start: 15 edges</text><rect x="42.00" y="180" width="787.50" height="40" rx="5" fill="#586aa2"/><rect x="829.50" y="180" width="87.50" height="40" rx="5" fill="#ba7550"/><circle cx="52" cy="252" r="6" fill="#586aa2"/><text x="67" y="258" font-size="17" fill="#242320">perfect matching</text><text x="67" y="282" font-size="15" fill="#625e57">F=3 · 9/10 · 90.0%</text><circle cx="497" cy="252" r="6" fill="#ba7550"/><text x="512" y="258" font-size="17" fill="#242320">K₃,₃</text><text x="512" y="282" font-size="15" fill="#625e57">F=9 · 1/10 · 10.0%</text><text x="43" y="330" font-size="23" fill="#242320">K7</text><text x="105" y="330" font-size="15" fill="#625e57">start: 21 edges</text><rect x="42.00" y="355" width="245.85" height="40" rx="5" fill="#586aa2"/><rect x="287.85" y="355" width="629.15" height="40" rx="5" fill="#ba7550"/><circle cx="52" cy="427" r="6" fill="#586aa2"/><text x="67" y="433" font-size="17" fill="#242320">empty leave</text><text x="67" y="457" font-size="15" fill="#625e57">F=0 · 1125/4004 · 28.1%</text><circle cx="497" cy="427" r="6" fill="#ba7550"/><text x="512" y="433" font-size="17" fill="#242320">six-cycle + isolated vertex</text><text x="512" y="457" font-size="15" fill="#625e57">F=6 · 2879/4004 · 71.9%</text><text x="43" y="510" font-size="14" fill="#625e57">A finite exact computation. The paper’s 1/(2√2) constant is an n→∞ statement.</text><text x="936" y="510" text-anchor="end" font-size="12" fill="#625e57">Marlow · family 188</text></svg>
