<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="A seven-part cycle-and-singleton-edge decomposition of a seven-vertex split graph" font-family="Georgia,serif"><rect width="920" height="520" fill="#f7f4ed"/><text x="44" y="55" fill="#242320" font-size="28">Seven parts on seven vertices</text><text x="44" y="83" fill="#5f5c55" font-size="16">K₃ joined to four independent vertices · hubs 0, 1, 2 · leaves 3, 4, 5, 6</text><rect x="43" y="112" width="834" height="268" rx="13" fill="#fffdf8" stroke="#ddd6c8"/><text x="65" y="151" fill="#5f5c55" font-size="16">CYCLES</text><path d="M 230 143 H 450" fill="none" stroke="#5b629b" stroke-width="5" stroke-linecap="round"/><circle cx="230" cy="143" r="17" fill="#fffdf8" stroke="#5b629b" stroke-width="3"/><text x="230" y="149" text-anchor="middle" font-size="18" fill="#242320">0</text><circle cx="340" cy="143" r="17" fill="#fffdf8" stroke="#5b629b" stroke-width="3"/><text x="340" y="149" text-anchor="middle" font-size="18" fill="#242320">1</text><circle cx="450" cy="143" r="17" fill="#fffdf8" stroke="#5b629b" stroke-width="3"/><text x="450" y="149" text-anchor="middle" font-size="18" fill="#242320">2</text><text x="610" y="149" font-size="15" fill="#5f5c55">closes at 0</text><path d="M 230 223 H 560" fill="none" stroke="#319184" stroke-width="5" stroke-linecap="round"/><circle cx="230" cy="223" r="17" fill="#fffdf8" stroke="#319184" stroke-width="3"/><text x="230" y="229" text-anchor="middle" font-size="18" fill="#242320">0</text><circle cx="340" cy="223" r="17" fill="#fffdf8" stroke="#319184" stroke-width="3"/><text x="340" y="229" text-anchor="middle" font-size="18" fill="#242320">3</text><circle cx="450" cy="223" r="17" fill="#fffdf8" stroke="#319184" stroke-width="3"/><text x="450" y="229" text-anchor="middle" font-size="18" fill="#242320">1</text><circle cx="560" cy="223" r="17" fill="#fffdf8" stroke="#319184" stroke-width="3"/><text x="560" y="229" text-anchor="middle" font-size="18" fill="#242320">4</text><text x="610" y="229" font-size="15" fill="#5f5c55">closes at 0</text><path d="M 230 303 H 560" fill="none" stroke="#a86845" stroke-width="5" stroke-linecap="round"/><circle cx="230" cy="303" r="17" fill="#fffdf8" stroke="#a86845" stroke-width="3"/><text x="230" y="309" text-anchor="middle" font-size="18" fill="#242320">0</text><circle cx="340" cy="303" r="17" fill="#fffdf8" stroke="#a86845" stroke-width="3"/><text x="340" y="309" text-anchor="middle" font-size="18" fill="#242320">5</text><circle cx="450" cy="303" r="17" fill="#fffdf8" stroke="#a86845" stroke-width="3"/><text x="450" y="309" text-anchor="middle" font-size="18" fill="#242320">1</text><circle cx="560" cy="303" r="17" fill="#fffdf8" stroke="#a86845" stroke-width="3"/><text x="560" y="309" text-anchor="middle" font-size="18" fill="#242320">6</text><text x="610" y="309" font-size="15" fill="#5f5c55">closes at 0</text><text x="65" y="356" fill="#5f5c55" font-size="16">SINGLETONS</text><rect x="192" y="330" width="100" height="35" rx="17" fill="#e9d7c9" stroke="#ba754e"/><text x="242" y="353" text-anchor="middle" font-size="17" fill="#583b2d">2–3</text><rect x="317" y="330" width="100" height="35" rx="17" fill="#e9d7c9" stroke="#ba754e"/><text x="367" y="353" text-anchor="middle" font-size="17" fill="#583b2d">2–4</text><rect x="442" y="330" width="100" height="35" rx="17" fill="#e9d7c9" stroke="#ba754e"/><text x="492" y="353" text-anchor="middle" font-size="17" fill="#583b2d">2–5</text><rect x="567" y="330" width="100" height="35" rx="17" fill="#e9d7c9" stroke="#ba754e"/><text x="617" y="353" text-anchor="middle" font-size="17" fill="#583b2d">2–6</text><text x="44" y="425" fill="#242320" font-size="17">The three cycles use 3 + 4 + 4 edges; the four singletons use the remaining edges.</text><text x="44" y="453" fill="#5f5c55" font-size="15">Every leaf needs a singleton by parity; with fewer than three cycles, hub degrees force more.</text><text x="876" y="495" fill="#77736c" font-size="12" text-anchor="end">Marlow · family 181 · finite exact census</text></svg>
