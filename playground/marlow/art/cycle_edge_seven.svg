<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="A seven-part cycle-and-singleton-edge decomposition of a seven-vertex split graph" font-family="Georgia,serif">
<rect width="920" height="520" fill="#f7f4ed"/>
<text x="44" y="55" fill="#242320" font-size="28">Seven parts on seven vertices</text>
<text x="44" y="83" fill="#5f5c55" font-size="16">K₃ joined to four independent vertices · hubs 0, 1, 2 · leaves 3, 4, 5, 6</text>
<rect x="43" y="112" width="834" height="268" rx="13" fill="#fffdf8" stroke="#ddd6c8"/>
<text x="65" y="151" fill="#5f5c55" font-size="16">CYCLES</text>
<g fill="none" stroke-width="5" stroke-linecap="round">
<path d="M 230 143 H 340 H 450" stroke="#5b629b"/>
<path d="M 230 223 H 340 H 450 H 560" stroke="#319184"/>
<path d="M 230 303 H 340 H 450 H 560" stroke="#a86845"/>
</g>
<g fill="#fffdf8" stroke-width="3" text-anchor="middle" dominant-baseline="central" font-size="18">
<circle cx="230" cy="143" r="17" stroke="#5b629b"/><circle cx="340" cy="143" r="17" stroke="#5b629b"/><circle cx="450" cy="143" r="17" stroke="#5b629b"/>
<circle cx="230" cy="223" r="17" stroke="#319184"/><circle cx="340" cy="223" r="17" stroke="#319184"/><circle cx="450" cy="223" r="17" stroke="#319184"/><circle cx="560" cy="223" r="17" stroke="#319184"/>
<circle cx="230" cy="303" r="17" stroke="#a86845"/><circle cx="340" cy="303" r="17" stroke="#a86845"/><circle cx="450" cy="303" r="17" stroke="#a86845"/><circle cx="560" cy="303" r="17" stroke="#a86845"/>
</g>
<g fill="#242320" text-anchor="middle" dominant-baseline="central" font-size="18">
<text x="230" y="143">0</text><text x="340" y="143">1</text><text x="450" y="143">2</text>
<text x="230" y="223">0</text><text x="340" y="223">3</text><text x="450" y="223">1</text><text x="560" y="223">4</text>
<text x="230" y="303">0</text><text x="340" y="303">5</text><text x="450" y="303">1</text><text x="560" y="303">6</text>
</g>
<g fill="#5f5c55" font-size="15">
<text x="610" y="149">closes at 0</text>
<text x="610" y="229">closes at 0</text>
<text x="610" y="309">closes at 0</text>
</g>
<text x="65" y="356" fill="#5f5c55" font-size="16">SINGLETONS</text>
<g fill="#e9d7c9" stroke="#ba754e"><rect x="192" y="330" width="100" height="35" rx="17"/><rect x="317" y="330" width="100" height="35" rx="17"/><rect x="442" y="330" width="100" height="35" rx="17"/><rect x="567" y="330" width="100" height="35" rx="17"/></g>
<g fill="#583b2d" font-size="17" text-anchor="middle"><text x="242" y="353">2–3</text><text x="367" y="353">2–4</text><text x="492" y="353">2–5</text><text x="617" y="353">2–6</text></g>
<text x="44" y="425" fill="#242320" font-size="17">The three cycles use 3 + 4 + 4 edges; the four singletons use the remaining edges.</text>
<text x="44" y="453" fill="#5f5c55" font-size="15">Every leaf needs a singleton by parity; with fewer than three cycles, hub degrees force more.</text>
<text x="876" y="495" fill="#77736c" font-size="12" text-anchor="end">Marlow · family 181 · finite exact census</text>
</svg>
