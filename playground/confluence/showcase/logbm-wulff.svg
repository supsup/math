<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600"><rect width="480" height="600" fill="#0d1b2a"/><text x="240" y="38" text-anchor="middle" font-family="serif" font-size="21" fill="#e8eef2">Bigger than the geometric mean</text><text x="240" y="60" text-anchor="middle" font-family="serif" font-style="italic" font-size="13" fill="#7d92a6">the log-Brunn-Minkowski inequality for two squares</text><polygon points="368.43,289.20 368.43,182.80 293.20,107.57 186.80,107.57 111.57,182.80 111.57,289.20 186.80,364.43 293.20,364.43" fill="#f4d58d" fill-opacity="0.22" stroke="#f4d58d" stroke-width="2.2"/><polygon points="348.00,128.00 132.00,128.00 132.00,344.00 348.00,344.00" fill="none" stroke="#8fd3ff" stroke-width="1.6"/><polygon points="392.74,236.00 240.00,83.26 87.26,236.00 240.00,388.74" fill="none" stroke="#ff8fa3" stroke-width="1.6"/><circle cx="240" cy="236" r="2.5" fill="#e8eef2"/><text x="354" y="122" font-family="sans-serif" font-size="12" fill="#8fd3ff">K</text><text x="398.712" y="240" font-family="sans-serif" font-size="12" fill="#ff8fa3">L</text><text x="270" y="104.24000000000001" font-family="sans-serif" font-size="12" fill="#f4d58d">W</text><rect x="150" y="392" width="180" height="60" fill="none" stroke="#7d92a6" stroke-width="0.6"/><line x1="150" y1="448.0" x2="330" y2="448.0" stroke="#7d92a6" stroke-dasharray="3 3"/><polyline points="150.0,448.0 168.0,429.2 186.0,414.6 204.0,404.3 222.0,398.1 240.0,396.0 258.0,398.1 276.0,404.3 294.0,414.6 312.0,429.2 330.0,448.0" fill="none" stroke="#f4d58d" stroke-width="1.8"/><text x="144" y="452.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d92a6">1</text><text x="144" y="400.0" text-anchor="end" font-family="sans-serif" font-size="10" fill="#7d92a6">1.172</text><text x="240.0" y="466" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7d92a6">|W_t| / |K|^(1-t)|L|^t  for t from 0 to 1</text><text x="240" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e8eef2">W = log-combination at t = 1/2: support at most √(h_K h_L) in every direction</text><text x="240" y="506" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e8eef2">|W| = 4.6863 against |K|^(1/2) |L|^(1/2) = 4: ratio 1.1716</text><text x="240" y="522" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f4d58d">W is the regular octagon of inradius 2^(1/4), area 16 - 8√2 = 4.6863</text><text x="240" y="538" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">The conjecture (BLYZ 2012), which the collection's family 091 claims to prove:</text><text x="240" y="554" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">|W| ≥ the geometric mean for origin-symmetric convex bodies, every dimension.</text><text x="240" y="570" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">The collection's Lean artifact kernel-checks that formal statement.</text><text x="240" y="592" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7d92a6">4,096 directions clipped; family 091 · Confluence</text></svg>