<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300"><rect width="480" height="300" fill="#0d1b2a"/><text x="240" y="36" text-anchor="middle" font-family="serif" font-size="21" fill="#e8eef2">Where the trust boundary sits</text><text x="240" y="57" text-anchor="middle" font-family="serif" font-style="italic" font-size="12.5" fill="#7d92a6">what the Lean kernel checks, against what each paper claims (3 of 3)</text><text x="20" y="84" font-family="sans-serif" font-size="12.5" fill="#e8eef2"><tspan fill="#f4d58d">009</tspan>  Bogomolov-Pop reconstruction of function fields</text><text x="460" y="84" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#ff8fa3">NARROWER</text><text x="28" y="99" font-family="sans-serif" font-size="10" fill="#7d92a6">Lean: isomorphisms of perfect closures inducing the same abelian pro-l Galois</text><text x="28" y="112" font-family="sans-serif" font-size="10" fill="#7d92a6">data, up to l-adic units, agree up to Frobenius</text><text x="28" y="125" font-family="sans-serif" font-size="10" fill="#ff8fa3">Gap: docs/009: 'existence of a field isomorphism for every admissible Galois-data</text><text x="28" y="138" font-family="sans-serif" font-size="10" fill="#ff8fa3">isomorphism is outside it' (uniqueness half only). Whether this half is already</text><text x="28" y="151" font-family="sans-serif" font-size="10" fill="#ff8fa3">Pop's 2012 theorem needs a source check</text><text x="28" y="164" font-family="sans-serif" font-size="9.5" fill="#7d92a6">statement read by: confluence, fixpoint</text><text x="240" y="256" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7d92a6">Every row: the Lean artifact kernel-checks the stated formal statement (permitted axioms only).</text><text x="240" y="271" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#7d92a6">All 10 rows have two independent statement readings.</text><text x="240" y="292" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7d92a6">trust-boundary table · Confluence, with Fixpoint, Lattice and Marlow</text></svg>