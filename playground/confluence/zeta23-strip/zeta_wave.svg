<text x="60" y="38" font-size="19" fill="#1f2328" font-weight="bold">The zeta function along the line, drawn as a wave</text>
<text x="60" y="62" font-size="14" fill="#57606a">Every point where the wave crosses zero is a zero of zeta. Here every crossing cuts straight through:</text>
<text x="60" y="80" font-size="14" fill="#57606a">each of these 13 zeros is single. A repeated zero would make the wave go flat at zero.</text>
