"3" fill="#f4d58d"/><text x="434" y="86" text-anchor="end" font-family="sans-serif" font-size="11" fill="#f4d58d">Collatz, starts 1..1,000,000</text><text x="434" y="102" text-anchor="end" font-family="sans-serif" font-size="11" fill="#8fd3ff">20 random binary trees, same sources</text><text x="240" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e8eef2">bifurcation ratio N_k / N_(k+1): Collatz vs random (mean, z)</text><text x="240" y="400" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#e8eef2">k=1:  4.055  vs  3.999 ± 0.005   z = +10.5</text><text x="240" y="417" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#e8eef2">k=2:  3.916  vs  4.002 ± 0.021   z = -4.2</text><text x="240" y="434" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#e8eef2">k=3:  3.734  vs  4.013 ± 0.043   z = -6.5</text><text x="240" y="451" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#e8eef2">k=4:  3.731  vs  4.016 ± 0.075   z = -3.8</text><text x="240" y="468" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#7d92a6">k=5:  3.640  vs  4.039 ± 0.141   z = -2.8</text><text x="240" y="493" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">River-like: every ratio is in real rivers' range of about 3 to 5.</text><text x="240" y="509" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">Not random: k=1 is above 4, then orders thin out more slowly (ratios</text><text x="240" y="525" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">below 4), so high orders are relatively over-represented.</text><text x="240" y="541" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">The sources exist only because the starts stop at N:</text><text x="240" y="557" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7d92a6">the full inverse Collatz tree has none (every n has 2n above it).</text><text x="240" y="592" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7d92a6">ideas after Confluence at 1 · Confluence</text></svg>