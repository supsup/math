<text x="390.0" y="836" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" fill="#a9b2c4">cubic &#183; bipartite (<tspan fill="#f2c14e">even</tspan> / <tspan fill="#7aa7ff">odd</tspan> permutations) &#183; planar &#183; 3-connected &#8594; one cycle through all 24</text>
<text x="390.0" y="858" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7f889a">every property asserted by the script that drew it, including that no two edges cross</text>
